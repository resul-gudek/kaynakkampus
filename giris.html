<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap – Kaynak Akademi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    /* ── RESET & BASE ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      color: #1e2d4d;
      background: #fff;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ── TOKENS ──────────────────────────────────────────── */
    :root {
      --blue:    #1a3c8f;
      --blue-dk: #122a6e;
      --teal:    #0ea5c9;
      --orange:  #f97316;
      --amber:   #fbbf24;
      --bg-soft: #f0f4ff;
      --text:    #1e2d4d;
      --muted:   #64748b;
      --white:   #ffffff;
      --radius:  14px;
      --shadow:  0 4px 24px rgba(26,60,143,.10);
      --shadow-lg: 0 12px 40px rgba(26,60,143,.16);
    }

    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 28px; border-radius: 50px; font-size: .95rem;
      font-weight: 600; cursor: pointer; transition: all .25s;
      border: none; font-family: inherit;
    }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { background: #ea6000; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(249,115,22,.35); }

    /* ── HEADER ──────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(26,60,143,.08);
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; color: var(--blue); }
    .logo-icon { width: 48px; height: 48px; object-fit: contain; }
    .logo span { color: var(--orange); }
    .geri-link { font-size: .9rem; font-weight: 600; color: var(--blue); padding: 8px 14px; border-radius: 8px; transition: all .2s; }
    .geri-link:hover { background: var(--bg-soft); }

    /* ── GİRİŞ ALANI ─────────────────────────────────────── */
    .giris-sahne {
      min-height: calc(100vh - 72px);
      background: linear-gradient(140deg, #e8effe 0%, #f0f4ff 50%, #fef3e8 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px; position: relative; overflow: hidden;
    }
    .giris-sahne::before {
      content: ''; position: absolute; top: -120px; right: -120px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,201,.12) 0%, transparent 70%);
    }
    .giris-sahne::after {
      content: ''; position: absolute; bottom: -80px; left: -80px;
      width: 380px; height: 380px; border-radius: 50%;
      background: radial-gradient(circle, rgba(249,115,22,.10) 0%, transparent 70%);
    }
    .giris-kart {
      position: relative; z-index: 1;
      background: #fff; border-radius: 20px; box-shadow: var(--shadow-lg);
      width: 100%; max-width: 440px; padding: 40px 36px;
    }
    .giris-kart h1 { font-size: 1.5rem; font-weight: 800; text-align: center; }
    .giris-kart h1 span { color: var(--orange); }
    .giris-alt { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 6px; }

    /* Rol sekmeleri */
    .rol-secim {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: var(--bg-soft); border-radius: 50px; padding: 6px; margin: 24px 0;
    }
    .rol-btn {
      border: none; background: transparent; font-family: inherit;
      padding: 10px 8px; border-radius: 50px; font-size: .9rem; font-weight: 600;
      color: var(--muted); cursor: pointer; transition: all .25s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .rol-btn.aktif { background: var(--blue); color: #fff; box-shadow: var(--shadow); }

    .form-grup { margin-bottom: 16px; }
    .form-grup label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-grup input {
      width: 100%; padding: 12px 16px; border: 2px solid rgba(26,60,143,.12);
      border-radius: 12px; font-family: inherit; font-size: .95rem; color: var(--text);
      transition: border-color .2s; background: #fff;
    }
    .form-grup input:focus { outline: none; border-color: var(--teal); }

    .hata-kutu {
      display: none; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      border-radius: 12px; padding: 10px 14px; font-size: .85rem; margin-bottom: 16px;
    }
    .hata-kutu.goster { display: block; }

    .demo-kutu {
      margin-top: 22px; background: var(--bg-soft); border-radius: 12px;
      padding: 14px 16px; font-size: .8rem; color: var(--muted); line-height: 1.7;
    }
    .demo-kutu strong { color: var(--blue); }
    .demo-kutu code {
      background: #fff; border-radius: 6px; padding: 1px 7px;
      font-family: inherit; font-weight: 600; color: var(--text);
    }

    @media (max-width: 520px) {
      .giris-kart { padding: 30px 22px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ HEADER -->
<header>
  <div class="container">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Kaynak Akademi Logosu" class="logo-icon" />
        Kaynak <span>Akademi</span>
      </a>
      <a href="index.html" class="geri-link">← Ana Sayfaya Dön</a>
    </div>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════ GİRİŞ -->
<main class="giris-sahne">
  <div class="giris-kart">
    <h1>Panele <span>Giriş Yap</span></h1>
    <p class="giris-alt">Hesap türünü seç, bilgilerinle giriş yap.</p>

    <div class="rol-secim" role="tablist">
      <button type="button" class="rol-btn aktif" id="rolKoc" data-rol="koc">🎓 Öğretmen</button>
      <button type="button" class="rol-btn" id="rolOgrenci" data-rol="ogrenci">📚 Öğrenci</button>
    </div>

    <div class="hata-kutu" id="hataKutu"></div>

    <form id="girisForm" autocomplete="off">
      <div class="form-grup">
        <label for="kullanici">Kullanıcı Adı</label>
        <input type="text" id="kullanici" placeholder="kullanıcı adınız" required />
      </div>
      <div class="form-grup">
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" placeholder="••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Giriş Yap →</button>
    </form>

    <div class="demo-kutu">
      <strong>Demo hesaplar:</strong><br>
      Öğretmen → <code>koc1</code> / <code>1234</code><br>
      Öğrenci → <code>ogrenci1</code> / <code>1234</code>
    </div>
  </div>
</main>

<script src="assets/kocluk.js"></script>
<script>
  // Zaten oturum açıksa doğrudan ilgili panele geç
  (function () {
    const u = KA.oturum();
    if (u) location.href = u.rol === "koc" ? "koc-panel.html" : "ogrenci-panel.html";
  })();

  let secilenRol = "koc";
  const rolBtnler = document.querySelectorAll(".rol-btn");
  rolBtnler.forEach(b => b.addEventListener("click", () => {
    rolBtnler.forEach(x => x.classList.remove("aktif"));
    b.classList.add("aktif");
    secilenRol = b.dataset.rol;
  }));

  document.getElementById("girisForm").addEventListener("submit", e => {
    e.preventDefault();
    const hata = document.getElementById("hataKutu");
    const u = KA.girisYap(
      document.getElementById("kullanici").value,
      document.getElementById("sifre").value,
      secilenRol
    );
    if (!u) {
      hata.textContent = "Kullanıcı adı, şifre ya da hesap türü hatalı. Lütfen tekrar deneyin.";
      hata.classList.add("goster");
      return;
    }
    location.href = u.rol === "koc" ? "koc-panel.html" : "ogrenci-panel.html";
  });
</script>
</body>
</html>
