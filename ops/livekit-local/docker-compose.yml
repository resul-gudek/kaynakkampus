services:
  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880" # WebSocket/API
      - "7881:7881" # WebRTC TCP fallback
      - "50000-50060:50000-50060/udp" # WebRTC medya
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
