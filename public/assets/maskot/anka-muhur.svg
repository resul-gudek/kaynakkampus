<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Kaynak Kampüs anka mührü">
  <title>Anka — armasal mühür (C)</title>
  <defs>
    <path id="tuy" d="M0 0C7-16 9-40 0-64C-9-40-7-16 0 0Z" fill="currentColor"/>
  </defs>

  <!-- logonun parantezleri -->
  <path d="M44 28A94 94 0 0 0 44 172" fill="none" stroke="var(--gul, #C98792)" stroke-width="3"/>
  <path d="M156 28A94 94 0 0 1 156 172" fill="none" stroke="var(--gul, #C98792)" stroke-width="3"/>

  <!-- kuyruk yelpazesi -->
  <g transform="translate(100,140)">
    <use href="#tuy" transform="rotate(160) scale(.8)" style="color:var(--gul, #C98792)"/>
    <use href="#tuy" transform="rotate(180) scale(.95)" style="color:var(--gul-ac, #E3BFC5)"/>
    <use href="#tuy" transform="rotate(200) scale(.8)" style="color:var(--gul, #C98792)"/>
  </g>

  <!-- simetrik kanatlar -->
  <g transform="translate(88,104)">
    <use href="#tuy" transform="rotate(-30) scale(.72)" style="color:var(--gul, #C98792)"/>
    <use href="#tuy" transform="rotate(-46) scale(.88)" style="color:var(--gul-ac, #E3BFC5)"/>
    <use href="#tuy" transform="rotate(-62) scale(.95)" style="color:var(--gul, #C98792)"/>
    <use href="#tuy" transform="rotate(-78) scale(.78)" style="color:var(--gul-ac, #E3BFC5)"/>
  </g>
  <g transform="translate(112,104)">
    <use href="#tuy" transform="rotate(30) scale(.72)" style="color:var(--gul, #C98792)"/>
    <use href="#tuy" transform="rotate(46) scale(.88)" style="color:var(--gul-ac, #E3BFC5)"/>
    <use href="#tuy" transform="rotate(62) scale(.95)" style="color:var(--gul, #C98792)"/>
    <use href="#tuy" transform="rotate(78) scale(.78)" style="color:var(--gul-ac, #E3BFC5)"/>
  </g>

  <!-- tepe sorgucu -->
  <g transform="translate(100,56)">
    <use href="#tuy" transform="rotate(-28) scale(.34)" style="color:var(--gul, #C98792)"/>
    <use href="#tuy" transform="rotate(0) scale(.42)" style="color:var(--gul-ac, #E3BFC5)"/>
    <use href="#tuy" transform="rotate(28) scale(.34)" style="color:var(--gul, #C98792)"/>
  </g>

  <!-- govde -->
  <path d="M100 64C113 64 123 82 123 104C123 128 113 146 100 146C87 146 77 128 77 104C77 82 87 64 100 64Z" fill="var(--bordo, #7A2035)"/>
  <path d="M100 98C104 98 107 107 107 116C107 127 104 134 100 134C96 134 93 127 93 116C93 107 96 98 100 98Z" fill="var(--krem, #FAF7F5)" opacity=".8"/>

  <!-- kafa -->
  <circle cx="100" cy="64" r="15" fill="var(--bordo, #7A2035)"/>
  <circle cx="94" cy="61" r="3.2" fill="var(--krem, #FAF7F5)"/>
  <circle cx="106" cy="61" r="3.2" fill="var(--krem, #FAF7F5)"/>
  <path d="M100 68 105.5 77 94.5 77Z" fill="var(--antrasit, #2F343D)"/>

  <!-- logonun elmasi -->
  <path d="M100 180 105 187 100 194 95 187Z" fill="var(--gul, #C98792)"/>
</svg>
